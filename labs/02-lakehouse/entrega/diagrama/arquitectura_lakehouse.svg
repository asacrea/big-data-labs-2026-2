<text x="30" y="38" font-size="22" font-weight="bold" fill="#1f2328">Arquitectura del lakehouse de PayTrack: batch y streaming</text>
<text x="30" y="64" font-size="13" fill="#57606a">Parte A · Batch: arriba, de izquierda a derecha. Parte B · Streaming: abajo, entra por bronze y escribe en las mismas tablas Delta.</text>
<text x="30" y="832" font-size="12" fill="#57606a">Infraestructura: infra/serverless.yml (Serverless Framework + CloudFormation). Las consultas de streaming guardan su progreso en checkpoints/.</text>
